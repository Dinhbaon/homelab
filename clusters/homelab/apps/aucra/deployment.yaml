              name: aucra-secret
              key: DSP_BID_ENDPOINT
        - name: DSP_API_SECRET
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_API_SECRET
        - name: DSP_ID
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_ID
        - name: R2_BUCKET_URL
