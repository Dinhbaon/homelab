apiVersion: v1
kind: Namespace
metadata:
  name: aucra
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aucra-dsp-api
  namespace: aucra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aucra-dsp-api
  template:
    metadata:
      labels:
        app: aucra-dsp-api
    spec:
      containers:
      - name: aucra-dsp-api
        image: aucra/aucra-dsp-api:main
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_DATABASE_URL
        - name: ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: ADMIN_KEY
        - name: JWT_ACCESS_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: JWT_ACCESS_TOKEN_SECRET
        - name: JWT_REFRESH_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: JWT_REFRESH_TOKEN_SECRET
        - name: DSP_BID_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_BID_ENDPOINT
        - name: DSP_API_SECRET
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_API_SECRET
        - name: DSP_ID
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_ID
        - name: R2_BUCKET_URL
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: R2_BUCKET_URL
        - name: R2_TOKEN
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: R2_TOKEN
        - name: R2_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: R2_ACCESS_KEY_ID
        - name: R2_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: R2_SECRET_ACCESS_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: aucra-dsp-api
  namespace: aucra
spec:
  selector:
    app: aucra-dsp-api
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aucra-dsp-api
  namespace: aucra
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: aucra-dsp-api
      port:
        number: 3000
  tls:
  - hosts:
    - aucra-dsp-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aucra-admin-portal
  namespace: aucra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aucra-admin-portal
  template:
    metadata:
      labels:
        app: aucra-admin-portal
    spec:
      containers:
      - name: aucra-admin-portal
        image: aucra/aucra-admin-portal:main
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: PORT
          value: "3001"
        - name: SSP_API_URL
          value: http://aucra-ssp-api.aucra.svc.cluster.local:8080
        - name: DSP_API_URL
          value: http://aucra-dsp-api.aucra.svc.cluster.local:3000
        - name: SSP_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: ADMIN_KEY
        - name: DSP_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: ADMIN_KEY
        - name: GOOGLE_CALLBACK_URL
          value: https://aucra-admin-portal.tail9b3001.ts.net/api/auth/google/callback
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: BETTER_AUTH_SECRET
        - name: BETTER_AUTH_BASE_URL
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: BETTER_AUTH_BASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: JWT_SECRET
        - name: JWT_ACCESS_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: JWT_ACCESS_TOKEN_SECRET
        - name: JWT_REFRESH_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: JWT_REFRESH_TOKEN_SECRET
        - name: JWTAccessTTL
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: JWTAccessTTL
        - name: JWTRefreshTTL
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: JWTRefreshTTL
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: GOOGLE_CLIENT_SECRET
        - name: ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: ADMIN_KEY
        - name: DSP_API_SECRET
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_API_SECRET
        - name: DSP_BID_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_BID_ENDPOINT
        - name: DSP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_DATABASE_URL
        - name: DSP_ID
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_ID
        - name: DSP_NAME
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: DSP_NAME
        - name: FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: FRONTEND_URL
        - name: SSP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: SSP_DATABASE_URL
        - name: SSP_DB_URL
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: SSP_DATABASE_URL
        - name: WHITELISTED_EMAILS
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: WHITELISTED_EMAILS
        - name: R2_BUCKET_URL
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: R2_BUCKET_URL
        - name: R2_TOKEN
          valueFrom:
            secretKeyRef:
              name: aucra-secret
              key: R2_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: aucra-admin-portal
  namespace: aucra
spec:
  selector:
    app: aucra-admin-portal
  ports:
  - port: 3001
    targetPort: 3001
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aucra-admin-portal
  namespace: aucra
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: aucra-admin-portal
      port:
        number: 3001
  tls:
  - hosts:
    - aucra-admin-portal
---
